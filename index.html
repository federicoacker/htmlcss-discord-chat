<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./styles/utility.css">
    <link rel="stylesheet" href="./styles/index.css">
    <title>HTMLCSS Discord Chat</title>
</head>
<body>
    <div class="application-wrapper d-flex flex-column">
        <main class="main flex-grow-1 d-flex bg-primary">
            <section class="servers flex-shrink-0 bg-primary"></section>
            <section class="chats flex-grow-1 bg-secondary b-radius-10 d-flex flex-column flex-row-gap-30">
                <header class="chats-header">
                    <h2 class="chats-header-title primary-text-color">Messaggi</h2>
                    <ul class="header-buttons d-flex primary-text-color flex-column-gap-10">
                        <li class="search-button">
                            <button class="btn search-button bg-tertiary">
                                <i class="bi bi-search primary-text-color"></i>
                            </button>
                        </li>
                        <li class="add-friends-button flex-grow-1">
                            <button class="btn add-friends-button bg-tertiary primary-text-color ">
                                <i class="bi bi-person-fill-add"></i>
                                Aggiungi amici
                            </button>
                        </li>
                    </ul>
                </header>
                <ul class="chat-list d-flex flex-column overflow-auto flex-row-gap-30">
                    <li class="chat d-flex flex-column-gap-10 flex-shrink-0 secondary-text-color">
                        <img class="chat-img flex-shrink-0" src="imgs/profile1.webp" Foto del profilo di Giuseppe Rossi">
                        <div class="chat-card flex-grow-1">
                            <h4 class="chat-card-title ">Giuseppe Rossi</h4>
                            <p class="chat-card-text">ciao! tutto bene?</p>
                        </div>
                    </li>
                   
                </ul>
                
            </section>
        </main>
        <footer class="footer flex-shrink-0 bg-footer">
        </footer>
    </div>    
</body>
</html>
